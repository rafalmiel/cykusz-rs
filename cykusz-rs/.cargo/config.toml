[build]
rustflags = [
    "-Z", "threads=8",
    "-Z", "next-solver=coherence",
    "-C", "link-arg=-Wl,--no-warn-rwx-segments",
    "-A", "future_incompatible"
]
target = "../x86_64-cykusz_os.json"

[unstable]
build-std-features = ["compiler-builtins-mem"]
build-std = ["alloc", "core", "compiler_builtins"]
